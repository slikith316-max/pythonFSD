
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flappy Bird Game</title>

    <style>
        /* Basic page styling */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(#70c5ce, #d8f4e8);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .game-container {
            text-align: center;
            position: relative;
        }

        h1 {
            color: #333;
            margin-bottom: 15px;
        }

        canvas {
            display: block;
            background: #70c5ce;
            border: 4px solid #333;
            border-radius: 10px;
            max-width: 95vw;
            max-height: 75vh;
            touch-action: none;
        }

        .score {
            position: absolute;
            top: 65px;
            width: 100%;
            font-size: 36px;
            font-weight: bold;
            color: white;
            text-shadow: 2px 2px 4px #333;
            pointer-events: none;
        }

        .overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 85%;
            background: rgba(255, 255, 255, 0.94);
            padding: 25px 15px;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .overlay h2 {
            color: #333;
            margin-bottom: 12px;
        }

        .overlay p {
            color: #555;
            line-height: 1.6;
            margin-bottom: 15px;
        }

        button {
            padding: 12px 25px;
            background: #ff9800;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #e68900;
        }

        .hidden {
            display: none;
        }

        .instructions {
            margin-top: 12px;
            color: #333;
            font-size: 14px;
        }
    </style>
</head>

<body>

<div class="game-container">

    <h1>Flappy Bird</h1>

    <canvas id="gameCanvas" width="400" height="600"></canvas>

    <div class="score" id="score">0</div>

    <!-- Start Screen -->
    <div class="overlay" id="startScreen">
        <h2>Flappy Bird</h2>
        <p>
            Help the bird fly through the pipes!<br>
            Avoid hitting obstacles and the ground.
        </p>
        <button id="startButton">Start Game</button>
        <p class="instructions">
            Spacebar / Click / Tap to Fly
        </p>
    </div>

    <!-- Game Over Screen -->
    <div class="overlay hidden" id="gameOverScreen">
        <h2>Game Over!</h2>
        <p>Your Final Score: <strong id="finalScore">0</strong></p>
        <button id="restartButton">Play Again</button>
    </div>

</div>

<script>
    // Get canvas and UI elements
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    const scoreElement = document.getElementById("score");
    const startScreen = document.getElementById("startScreen");
    const gameOverScreen = document.getElementById("gameOverScreen");
    const finalScoreElement = document.getElementById("finalScore");

    const startButton = document.getElementById("startButton");
    const restartButton = document.getElementById("restartButton");

    // Game dimensions
    const WIDTH = canvas.width;
    const HEIGHT = canvas.height;
    const GROUND_HEIGHT = 55;

    // Game settings
    const GRAVITY = 0.42;
    const JUMP_STRENGTH = -7.5;
    const PIPE_WIDTH = 65;
    const PIPE_GAP = 155;
    const PIPE_SPEED = 2.5;
    const PIPE_INTERVAL = 95;

    // Game state
    let bird;
    let pipes = [];
    let score = 0;
    let frameCount = 0;
    let gameState = "start";

    // Initialize bird
    function createBird() {
        return {
            x: 90,
            y: 280,
            radius: 15,
            velocity: 0
        };
    }

    // Reset game variables
    function resetGame() {
        bird = createBird();
        pipes = [];
        score = 0;
        frameCount = 0;

        scoreElement.textContent = score;
    }

    // Draw background
    function drawBackground() {
        // Sky
        ctx.fillStyle = "#70c5ce";
        ctx.fillRect(0, 0, WIDTH, HEIGHT);

        // Clouds
        ctx.fillStyle = "rgba(255,255,255,0.65)";

        drawCloud(65, 100);
        drawCloud(260, 170);
        drawCloud(170, 320);

        // Ground
        ctx.fillStyle = "#ded895";
        ctx.fillRect(
            0,
            HEIGHT - GROUND_HEIGHT,
            WIDTH,
            GROUND_HEIGHT
        );

        ctx.fillStyle = "#79c34a";
        ctx.fillRect(
            0,
            HEIGHT - GROUND_HEIGHT,
            WIDTH,
            10
        );
    }

    // Draw simple clouds
    function drawCloud(x, y) {
        ctx.beginPath();
        ctx.arc(x, y, 18, 0, Math.PI * 2);
        ctx.arc(x + 20, y - 10, 23, 0, Math.PI * 2);
        ctx.arc(x + 43, y, 18, 0, Math.PI * 2);
        ctx.fill();
    }

    // Draw bird
    function drawBird() {
        ctx.save();

        ctx.translate(bird.x, bird.y);

        // Rotate bird based on falling/rising velocity
        let angle = Math.min(
            Math.max(bird.velocity * 0.07, -0.4),
            0.8
        );

        ctx.rotate(angle);

        // Body
        ctx.fillStyle = "#ffeb3b";
        ctx.beginPath();
        ctx.arc(0, 0, bird.radius, 0, Math.PI * 2);
        ctx.fill();

        // Wing
        ctx.fillStyle = "#fbc02d";
        ctx.beginPath();
        ctx.ellipse(-5, 5, 8, 5, 0, 0, Math.PI * 2);
        ctx.fill();

        // Eye
        ctx.fillStyle = "white";
        ctx.beginPath();
        ctx.arc(7, -6, 5, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = "black";
        ctx.beginPath();
        ctx.arc(9, -6, 2, 0, Math.PI * 2);
        ctx.fill();

        // Beak
        ctx.fillStyle = "#ff5722";
        ctx.beginPath();
        ctx.moveTo(12, 0);
        ctx.lineTo(23, 5);
        ctx.lineTo(12, 9);
        ctx.closePath();
        ctx.fill();

        ctx.restore();
    }

    // Create a new pipe pair
    function createPipe() {
        const minTop = 55;
        const maxTop = HEIGHT - GROUND_HEIGHT - PIPE_GAP - 55;

        const topHeight = Math.random() * (maxTop - minTop) + minTop;

        pipes.push({
            x: WIDTH,
            topHeight: topHeight,
            bottomY: topHeight + PIPE_GAP,
            passed: false
        });
    }

    // Draw pipes
    function drawPipes() {
        pipes.forEach(pipe => {

            // Top pipe
            ctx.fillStyle = "#2e9e36";
            ctx.fillRect(
                pipe.x,
                0,
                PIPE_WIDTH,
                pipe.topHeight
            );

            // Top pipe cap
            ctx.fillStyle = "#197c29";
            ctx.fillRect(
                pipe.x - 5,
                pipe.topHeight - 20,
                PIPE_WIDTH + 10,
                20
            );

            // Bottom pipe
            ctx.fillStyle = "#2e9e36";
            ctx.fillRect(
                pipe.x,
                pipe.bottomY,
                PIPE_WIDTH,
                HEIGHT - GROUND_HEIGHT - pipe.bottomY
            );

            // Bottom pipe cap
            ctx.fillStyle = "#197c29";
            ctx.fillRect(
                pipe.x - 5,
                pipe.bottomY,
                PIPE_WIDTH + 10,
                20
            );
        });
    }

    // Update bird physics
    function updateBird() {
        bird.velocity += GRAVITY;
        bird.y += bird.velocity;
    }

    // Move pipes and award points
    function updatePipes() {
        frameCount++;

        if (frameCount % PIPE_INTERVAL === 0) {
            createPipe();
        }

        pipes.forEach(pipe => {
            pipe.x -= PIPE_SPEED;

            // Award a point when bird passes a pipe
            if (!pipe.passed && pipe.x + PIPE_WIDTH < bird.x) {
                pipe.passed = true;
                score++;

                scoreElement.textContent = score;
            }
        });

        // Remove pipes outside the screen
        pipes = pipes.filter(
            pipe => pipe.x + PIPE_WIDTH > 0
        );
    }

    // Collision detection
    function checkCollision() {

        // Ceiling collision
        if (bird.y - bird.radius <= 0) {
            return true;
        }

        // Ground collision
        if (bird.y + bird.radius >= HEIGHT - GROUND_HEIGHT) {
            return true;
        }

        // Pipe collision
        for (const pipe of pipes) {

            const birdLeft = bird.x - bird.radius;
            const birdRight = bird.x + bird.radius;
            const birdTop = bird.y - bird.radius;
            const birdBottom = bird.y + bird.radius;

            const horizontalCollision =
                birdRight > pipe.x &&
                birdLeft < pipe.x + PIPE_WIDTH;

            const verticalCollision =
                birdTop < pipe.topHeight ||
                birdBottom > pipe.bottomY;

            if (horizontalCollision && verticalCollision) {
                return true;
            }
        }

        return false;
    }

    // Bird jump action
    function flap() {
        if (gameState === "playing") {
            bird.velocity = JUMP_STRENGTH;
        }
    }

    // End the game
    function endGame() {
        gameState = "over";

        finalScoreElement.textContent = score;
        gameOverScreen.classList.remove("hidden");
    }

    // Main game loop
    function gameLoop() {

        // Clear and redraw background
        drawBackground();

        if (gameState === "playing") {

            updateBird();
            updatePipes();

            // Check collisions
            if (checkCollision()) {
                endGame();
            }
        }

        // Draw game objects
        drawPipes();
        drawBird();

        // Continue animation
        if (gameState !== "over") {
            requestAnimationFrame(gameLoop);
        }
    }

    // Start or restart game
    function startGame() {
        resetGame();

        gameState = "playing";

        startScreen.classList.add("hidden");
        gameOverScreen.classList.add("hidden");

        gameLoop();
    }

    // Keyboard controls
    document.addEventListener("keydown", function(event) {

        if (event.code === "Space") {
            event.preventDefault();

            if (gameState === "playing") {
                flap();
            } else if (gameState === "start") {
                startGame();
                flap();
            } else if (gameState === "over") {
                startGame();
                flap();
            }
        }
    });

    // Mouse and touch controls
    canvas.addEventListener("pointerdown", function(event) {
        event.preventDefault();

        if (gameState === "playing") {
            flap();
        }
    });

    // Button controls
    startButton.addEventListener("click", startGame);
    restartButton.addEventListener("click", startGame);

    // Initial game setup
    resetGame();
    drawBackground();
    drawBird();

</script>

</body>
</html>
